version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Pipetrace follows Django's long-term-support releases (5.2 LTS until April 2028).
      - dependency-name: django
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      python:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
