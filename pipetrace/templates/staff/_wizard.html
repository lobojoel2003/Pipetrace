{% load i18n %}
<ol class="wizard" aria-label="{% translate 'Import steps' %}">
  <li class="{% if step > 1 %}done{% elif step == 1 %}current{% endif %}">{% translate "Upload" %}</li>
  <li class="{% if step > 2 %}done{% elif step == 2 %}current{% endif %}">{% translate "Match columns" %}</li>
  <li class="{% if step > 3 %}done{% elif step == 3 %}current{% endif %}">{% translate "Check values" %}</li>
  <li class="{% if step > 4 %}done{% elif step == 4 %}current{% endif %}">{% translate "Preview and import" %}</li>
</ol>
